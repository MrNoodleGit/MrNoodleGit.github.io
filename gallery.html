<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ra Mour — Altar</title>
    <meta
      name="description"
      content="An altar of art, music, films, and books that Ra Mour returns to."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=16" />
    <link rel="stylesheet" href="css/gallery.css?v=3" />
  </head>
  <body class="gallery">
    <header class="gal-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <section class="gal-intro">
      <h1>Altar</h1>
    </section>

    <!-- Filled by js/gallery.js from the contents of media/art-gallery/ —
       drop an image into that folder and it appears here.
       Quotes come from quotes.md (template inside). -->
    <div class="wall" id="wall" aria-live="polite"></div>

    <noscript>
      <p class="gal-note">Enable JavaScript to view the altar.</p>
    </noscript>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Enlarged artwork"
      hidden
    >
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightbox-img" src="" alt="" />
      </figure>
      <button
        class="lightbox__close"
        id="lightbox-close"
        type="button"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <footer class="gal-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/gallery-discovery.js?v=1"></script>
    <script src="js/gallery.js?v=6"></script>
  </body>
</html>
