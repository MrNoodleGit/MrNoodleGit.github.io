<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: which sites this page may load things
         from. Keep identical on every page (and in _headers). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://i.scdn.co; media-src 'self' blob:; connect-src 'self' https://ra-mour-radio.ronald1andres2.workers.dev; frame-src https://open.spotify.com https://ramour.substack.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>Ra Mour — Altar</title>
    <meta
      name="description"
      content="An altar of art, music, films, and books that Ra Mour returns to."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- start fetching the image list right away instead of after the scripts run -->
    <link rel="preload" href="media/art-gallery.json" as="fetch" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/reveal.js"></script>
    <link rel="stylesheet" href="css/gallery.css" />
  </head>
  <body class="gallery">
    <header class="gal-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <section class="gal-intro">
      <h1>Altar</h1>
    </section>

    <!-- Filled by js/gallery.js from the contents of media/art-gallery/ —
       drop an image into that folder and it appears here once the
       "Build altar gallery" GitHub Action has run (about a minute).
       Quotes come from quotes.md (template inside). -->
    <div class="wall" id="wall" aria-live="polite"></div>

    <noscript>
      <p class="gal-note">Enable JavaScript to view the altar.</p>
    </noscript>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Enlarged artwork"
      hidden
    >
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightbox-img" alt="" />
      </figure>
      <button
        class="lightbox__step lightbox__step--prev"
        type="button"
        data-step="-1"
        aria-label="Previous image"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" /></svg>
      </button>
      <button
        class="lightbox__step lightbox__step--next"
        type="button"
        data-step="1"
        aria-label="Next image"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg>
      </button>
      <button
        class="lightbox__close"
        id="lightbox-close"
        type="button"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <footer class="gal-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/gallery-discovery.js"></script>
    <script src="js/gallery.js"></script>
  </body>
</html>
