name = "ra-mour-radio"
main = "now-playing.js"
compatibility_date = "2026-09-01"

# Secrets are NOT set here — they would end up in git. Set them with:
#   npx wrangler secret put SPOTIFY_CLIENT_ID
#   npx wrangler secret put SPOTIFY_CLIENT_SECRET
#   npx wrangler secret put SPOTIFY_REFRESH_TOKEN
#   npx wrangler secret put HISTORY_TOKEN     (any random string you pick;
#                                              guards GET /history)

# Private listen-history log. Create it once with:
#   npx wrangler kv namespace create HISTORY
# then paste the "id" it prints below.
[[kv_namespaces]]
binding = "HISTORY"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Moments — voice recordings anchored to a track. Create once with:
#   npx wrangler kv namespace create MOMENTS
#   npx wrangler r2 bucket create ra-mour-moments
# then paste the KV "id" it prints below (the R2 bucket name is fixed).
[[kv_namespaces]]
binding = "MOMENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MOMENTS_AUDIO"
bucket_name = "ra-mour-moments"
