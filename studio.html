<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ra Mour — Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=18" />
    <link rel="stylesheet" href="css/music.css?v=2" />
    <link rel="stylesheet" href="css/studio.css?v=1" />
  </head>
  <body class="music">
    <header class="music-back">
      <a href="music.html">Ra Mour</a>
    </header>

    <section class="music-intro">
      <h1>Studio</h1>
      <p>A moment, anchored to whatever's playing.</p>
    </section>

    <!-- Token gate. Not real auth — just enough to stop a stray visitor
       from posting a recording. The Worker is what actually enforces it. -->
    <section class="studio-gate" id="studio-gate">
      <label for="studio-token-input">Studio token</label>
      <div class="studio-gate__row">
        <input
          type="password"
          id="studio-token-input"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="studio-unlock">Unlock</button>
      </div>
      <p class="studio-note" id="studio-gate-note"></p>
    </section>

    <section class="studio-main" id="studio-main" hidden>
      <!-- ---------- anchor: the track this moment attaches to ---------- -->
      <div class="studio-panel">
        <h2>Anchor</h2>
        <p class="studio-note">
          Defaults to what's on the band right now. Edit it, or paste a
          different Spotify track link, to anchor this moment elsewhere.
        </p>

        <div class="studio-field">
          <label for="studio-title">Title</label>
          <input type="text" id="studio-title" autocomplete="off" />
        </div>
        <div class="studio-field">
          <label for="studio-artist">Artist</label>
          <input type="text" id="studio-artist" autocomplete="off" />
        </div>
        <div class="studio-field">
          <label for="studio-album">Album</label>
          <input type="text" id="studio-album" autocomplete="off" />
        </div>
        <div class="studio-field">
          <label for="studio-track-url">Spotify track link</label>
          <input
            type="url"
            id="studio-track-url"
            autocomplete="off"
            placeholder="https://open.spotify.com/track/..."
          />
        </div>

        <button type="button" class="studio-btn-ghost" id="studio-refresh">
          Use what's playing now
        </button>
        <p class="studio-note" id="studio-anchor-status"></p>
      </div>

      <!-- ---------- recorder ---------- -->
      <div class="studio-panel">
        <h2>Record</h2>

        <div class="studio-recorder">
          <button type="button" id="studio-record" class="studio-btn-record">
            Record
          </button>
          <span class="studio-timer" id="studio-timer">0:00</span>
        </div>

        <div class="studio-preview" id="studio-preview" hidden>
          <audio controls id="studio-audio"></audio>
          <div class="studio-field">
            <label for="studio-caption">Caption (optional)</label>
            <textarea id="studio-caption" rows="2"></textarea>
          </div>
          <div class="studio-preview__actions">
            <button type="button" id="studio-save" class="studio-btn-record">
              Save moment
            </button>
            <button type="button" id="studio-discard" class="studio-btn-ghost">
              Discard
            </button>
          </div>
        </div>

        <p class="studio-note" id="studio-record-status"></p>
      </div>

      <!-- ---------- existing moments for this anchor ---------- -->
      <div class="studio-panel">
        <h2>Already recorded here</h2>
        <ul class="studio-moments" id="studio-moments"></ul>
        <p class="studio-note" id="studio-moments-empty">Nothing yet.</p>
      </div>
    </section>

    <footer class="music-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/studio.js?v=1"></script>
  </body>
</html>
