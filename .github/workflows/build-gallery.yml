name: Build altar gallery

# Rebuilds media/art-gallery.json and the resized copies whenever images
# are added, replaced, or removed in media/art-gallery/.
on:
  push:
    branches: [main]
    paths:
      - "media/art-gallery/**"
      - "scripts/build-gallery.mjs"
      - "scripts/package-lock.json"
      - ".github/workflows/build-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits (tags can be moved); Dependabot
      # proposes updates, see .github/dependabot.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # no shared dependency cache in a workflow that can push to main
          package-manager-cache: false

      # exact versions from scripts/package-lock.json, checked against their hashes
      - run: npm ci --prefix scripts --omit=dev

      - run: node scripts/build-gallery.mjs

      - name: Commit if the gallery changed
        run: |
          git add media/art-gallery.json media/art-gallery-thumbs media/art-gallery-large
          if git diff --cached --quiet; then
            echo "Gallery already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build altar gallery"
          git push
