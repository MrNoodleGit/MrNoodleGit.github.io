name: Post to Instagram

on:
  workflow_dispatch:
# Manual-only by design: tag a quote in quotes.md with an "image:" line,
# push, then trigger a run yourself from the Actions tab when you're
# ready to post. To go back to an automatic weekly cadence, uncomment
# the schedule below (21:00 UTC = 3:00 PM Mountain Daylight Time;
# during Mountain Standard Time it fires at 2:00 PM Mountain instead,
# since GitHub Actions cron is fixed-UTC with no DST awareness).
# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "0 21 * * 5"

permissions:
  contents: write

concurrency:
  group: post-instagram
  cancel-in-progress: false # never cancel a run that might be mid-publish

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/post-instagram.mjs

      - name: Commit state if changed
        run: |
          if git diff --quiet -- scripts/instagram-state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/instagram-state.json
          git commit -m "update instagram post queue"
          git push
