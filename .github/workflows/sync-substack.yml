name: Sync Substack essays

on:
  workflow_dispatch:
# on:
#   schedule:
#     - cron: "0 13 * * *"
#   workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-substack
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/sync-substack.mjs

      - name: Commit if writing.md changed
        run: |
          if git diff --quiet -- writing.md; then
            echo "No new essays."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.md
          git commit -m "sync substack essays"
          git push
