<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: which sites this page may load things
         from. Keep identical on every page (and in _headers). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://i.scdn.co; media-src 'self' blob:; connect-src 'self' https://ra-mour-radio.ronald1andres2.workers.dev; frame-src https://open.spotify.com https://ramour.substack.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>Ra Mour — RARE. Retreats</title>
    <meta
      name="description"
      content="RARE. Retreats — for individuals and teams that want to experience what it's like to be as fully alive as productive."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/rare-retreats.css" />

  <body class="rr">
    <header class="rr-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <main
      class="rr-scene"
      role="img"
      aria-label="A large portrait painting of the Tower of Babel hanging on a gallery wall, its gilded frame ringed in a warm golden glow."
    >
      <div class="rr-stage">
        <div class="rr-gallery" aria-hidden="true">
          <div class="rr-halo"></div>
          <div class="rr-frame">
            <img
              class="rr-frame__art"
              src="media/art-gallery/tower-of-babel.png"
              alt=""
              loading="lazy"
            />
          </div>
          <div class="rr-frame__shadow"></div>
        </div>
      </div>

      <div class="rr-copy">
        <p class="rr-soon">Coming soon</p>
        <iframe class="rr-subscribe" src="https://ramour.substack.com/embed?transparent=1&light=1" width="480" height="150" frameborder="0" scrolling="no"></iframe>
      </div>
    </main>
  </body>
</html>
