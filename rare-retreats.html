<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ra Mour — RARE. Retreats</title>
    <meta
      name="description"
      content="RARE. Retreats — for individuals and teams that want to experience what it's like to be as fully alive as productive."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=11" />
    <link rel="stylesheet" href="css/rare-retreats.css?v=2" />
  </head>
  <body class="rr">
    <header class="rr-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <main
      class="rr-scene"
      role="img"
      aria-label="A black hole turning in deep space, its bright accretion disk circling a dark event horizon, with a luminous figure-eight loop folding endlessly into itself at the center."
    >
      <div class="rr-stars" aria-hidden="true"></div>

      <div class="rr-hole" aria-hidden="true">
        <span class="rr-glow"></span>
        <span class="rr-disk"></span>
        <span class="rr-ring"></span>
        <span class="rr-horizon"></span>

        <!-- strange loop: rings receding into themselves + an endless figure-eight -->
        <span class="rr-rec"></span>
        <span class="rr-rec"></span>
        <span class="rr-rec"></span>
        <span class="rr-rec"></span>

        <svg class="rr-loop" viewBox="-110 -55 220 110">
          <path
            class="rr-loop__path"
            d="M0 0 C 28 -34 86 -34 86 0 C 86 34 28 34 0 0 C -28 -34 -86 -34 -86 0 C -86 34 -28 34 0 0 Z"
          />
        </svg>
      </div>

      <div class="rr-scrim" aria-hidden="true"></div>

      <div class="rr-copy">
        <h1 class="rr-title">RARE<span class="rr-dot">.</span> Retreats</h1>
        <p class="rr-sub">
          For individuals and teams that want to experience what it’s like to be
          as alive as they are successful.
        </p>
        <p class="rr-soon">Coming soon</p>
        <iframe class="rr-subscribe" src="https://ramour.substack.com/embed?transparent=1&light=1" width="480" height="150" style="border: 0; background: transparent" frameborder="0" scrolling="no"></iframe>
      </div>
    </main>
  </body>
</html>
