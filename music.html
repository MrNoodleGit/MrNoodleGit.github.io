<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ra Mour — Music</title>
    <meta
      name="description"
      content="Songs and playlists Ra Mour keeps returning to."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=18" />
    <link rel="stylesheet" href="css/music.css?v=2" />
    <link rel="stylesheet" href="css/radio.css?v=1" />
  </head>
  <body class="music">
    <header class="music-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <section class="music-intro">
      <h1>Music</h1>
      <!-- <p>Songs and playlists I keep returning to.</p> -->
    </section>

    <!-- Ra Mour Radio — live now-playing band, filled by js/radio.js from the
       Cloudflare Worker in worker/now-playing.js. Ships hidden: if the Worker
       isn't reachable, the page simply doesn't show it. -->
    <section
      class="radio"
      id="radio"
      aria-label="Ra Mour Radio"
      aria-live="polite"
      hidden
    >
      <div class="radio__backdrop" aria-hidden="true">
        <img id="radio-backdrop" alt="" />
      </div>

      <div class="radio__cover">
        <img class="radio__art" id="radio-art" alt="" />
      </div>

      <div class="radio__body">
        <p class="radio__status">
          <span class="radio__dot" aria-hidden="true"></span>
          <span id="radio-status">On air</span>
          <span class="radio__brand">&middot; Ra Mour Radio</span>
        </p>

        <h2 class="radio__title" id="radio-title"></h2>
        <p class="radio__artist" id="radio-artist"></p>
        <p class="radio__album" id="radio-album"></p>

        <div class="radio__wave" id="radio-wave" aria-hidden="true"></div>

        <p class="radio__meta">
          <span class="radio__time" id="radio-time"></span>
          <a
            class="radio__link"
            id="radio-link"
            href="https://open.spotify.com"
            target="_blank"
            rel="noopener"
            >Listen along</a
          >
        </p>
      </div>
    </section>

    <!-- Filled by js/music.js from music.md (template inside) —
       add a track or playlist entry there and it appears here. -->
    <div class="music-grid" id="music-grid" aria-live="polite"></div>

    <noscript>
      <p
        class="gal-note"
        style="
          max-width: var(--measure);
          margin: 0 auto;
          padding: 0 var(--pad) 3rem;
          color: var(--muted);
        "
      >
        Enable JavaScript to view the recommendations.
      </p>
    </noscript>

    <footer class="music-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/radio.js?v=2"></script>
    <script src="js/music.js?v=2"></script>
  </body>
</html>
