<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ra Mour — Music</title>
    <meta
      name="description"
      content="Songs and playlists Ra Mour keeps returning to."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=18" />
    <link rel="stylesheet" href="css/music.css?v=2" />
    <link rel="stylesheet" href="css/radio.css?v=2" />
  </head>
  <body class="music">
    <header class="music-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <section class="music-intro">
      <h1>Music</h1>
      <!-- <p>Songs and playlists I keep returning to.</p> -->
    </section>

    <!-- Ra Mour Radio — live now-playing band, filled by js/radio.js from the
       Cloudflare Worker in worker/now-playing.js. Ships hidden: if the Worker
       isn't reachable, the page simply doesn't show it. -->
    <section
      class="radio"
      id="radio"
      aria-label="Ra Mour Radio"
      aria-live="polite"
      hidden
    >
      <div class="radio__backdrop" aria-hidden="true">
        <img id="radio-backdrop" alt="" />
      </div>

      <!-- Dances only while .radio.is-playing (set by js/radio.js) is on
           the section; freezes mid-pose otherwise. Tempo: css/radio.css,
           --robot-beat on .radio__bot. -->
      <svg
        class="radio__bot"
        viewBox="0 0 60 100"
        aria-hidden="true"
        focusable="false"
      >
        <g class="rb-part rb-all">
          <g class="rb-part rb-ant">
            <rect class="rb-dark" x="28" y="4" width="4" height="10" />
            <circle class="rb-eye rb-glow" cx="30" cy="4" r="3.5" />
          </g>
          <g class="rb-part rb-head">
            <rect class="rb-body rb-glow" x="15" y="14" width="30" height="20" rx="3" />
            <rect class="rb-dark" x="19" y="20" width="22" height="7" rx="1.5" />
            <rect class="rb-eye" x="22" y="22" width="4" height="3.5" />
            <rect class="rb-eye" x="34" y="22" width="4" height="3.5" />
          </g>
          <g class="rb-part rb-torso">
            <rect class="rb-dark" x="26" y="34" width="8" height="4" />
            <rect class="rb-body rb-glow" x="17" y="38" width="26" height="26" rx="3" />
            <circle class="rb-eye" cx="30" cy="48" r="3.5" />
            <g class="rb-part rb-arm-l">
              <rect class="rb-body" x="9" y="40" width="6" height="24" rx="3" />
            </g>
            <g class="rb-part rb-arm-r">
              <rect class="rb-body" x="45" y="40" width="6" height="24" rx="3" />
            </g>
            <g class="rb-part rb-leg-l">
              <rect class="rb-body" x="20" y="64" width="7" height="22" rx="2.5" />
            </g>
            <g class="rb-part rb-leg-r">
              <rect class="rb-body" x="33" y="64" width="7" height="22" rx="2.5" />
            </g>
          </g>
        </g>
      </svg>

      <div class="radio__cover">
        <img class="radio__art" id="radio-art" alt="" />
      </div>

      <div class="radio__body">
        <p class="radio__status">
          <span class="radio__dot" aria-hidden="true"></span>
          <span id="radio-status">On air</span>
          <span class="radio__brand">&middot; Ra Mour Radio</span>
        </p>

        <h2 class="radio__title" id="radio-title"></h2>
        <p class="radio__artist" id="radio-artist"></p>
        <p class="radio__album" id="radio-album"></p>

        <div class="radio__wave" id="radio-wave" aria-hidden="true"></div>

        <p class="radio__meta">
          <span class="radio__time" id="radio-time"></span>
          <a
            class="radio__link"
            id="radio-link"
            href="https://open.spotify.com"
            target="_blank"
            rel="noopener"
            >Listen along</a
          >
        </p>
      </div>
    </section>

    <!-- Filled by js/music.js from music.md (template inside) —
       add a track or playlist entry there and it appears here. -->
    <div class="music-grid" id="music-grid" aria-live="polite"></div>

    <noscript>
      <p
        class="gal-note"
        style="
          max-width: var(--measure);
          margin: 0 auto;
          padding: 0 var(--pad) 3rem;
          color: var(--muted);
        "
      >
        Enable JavaScript to view the recommendations.
      </p>
    </noscript>

    <footer class="music-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/radio.js?v=1"></script>
    <script src="js/music.js?v=2"></script>
  </body>
</html>
