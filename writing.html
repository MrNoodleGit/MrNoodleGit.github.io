<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: which sites this page may load things
         from. Keep identical on every page (and in _headers). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://i.scdn.co; media-src 'self' blob:; connect-src 'self' https://ra-mour-radio.ronald1andres2.workers.dev; frame-src https://open.spotify.com https://ramour.substack.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>Ra Mour — Writing</title>
    <meta
      name="description"
      content="Essays by Ra Mour on art, science, philosophy, and spirituality."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/reveal.js"></script>
    <link rel="stylesheet" href="css/writing.css" />
  </head>
  <body class="writing">
    <header class="writing-back">
      <a href="index.html">Ra Mour</a>
    </header>

    <section class="writing-intro">
      <p>Essays on art, science, philosophy, and spirituality.</p>
    </section>

    <!-- Filled by js/writing-archive.js from writing.md (template inside) —
       add an entry there and it appears here. -->
    <div class="writing-list">
      <ul class="essays" id="essays-list" aria-live="polite"></ul>

      <p class="essays__more">
        <a
          class="textlink"
          href="https://substack.com/@ramour"
          target="_blank"
          rel="noopener"
          >Read on Substack &rarr;</a
        >
      </p>
    </div>

    <noscript>
      <p class="noscript-note">
        Enable JavaScript to view the archive.
      </p>
    </noscript>

    <footer class="writing-footer">
      <p>&copy; 2026 Ra Mour</p>
    </footer>

    <script src="js/writing-data.js"></script>
    <script src="js/writing-archive.js"></script>
  </body>
</html>
