<!doctype html>
<!--
  Print source for the physical business card (US 3.5 × 2 in, vertical).
  Each page is the card plus 0.125 in bleed on every side (2.25 × 3.75 in);
  keep text inside the safe zone, 0.125 in in from the trim line.
  Rendered to PDF/PNG by scripts/render-card.mjs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ra Mour — Business card (print)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #020202;
        --abyss: #061719;
        --teal: #14636F;
        --zima: #5BC2E7;
        --crimson: #AE0E36;
        --text: #E8F0F0;
        --muted: #7FA8AD;

        --font-display: "Marcellus", "Times New Roman", serif;
        --font-body: "EB Garamond", Georgia, serif;

        --bleed: 0.125in;
        --page-w: 2.25in;
        --page-h: 3.75in;
      }

      @page { size: 2.25in 3.75in; margin: 0; }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--ink);
        color: var(--text);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        position: relative;
        width: var(--page-w);
        height: var(--page-h);
        overflow: hidden;
        break-after: page;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(20, 99, 111, 0.4), transparent 65%),
          linear-gradient(to bottom, var(--abyss), var(--ink));
      }

      /* ---------- front ---------- */

      /* The full painting, uncropped (3:4), set inside the trim. */
      .front__portrait {
        position: absolute;
        top: 0.45in;
        left: 0.325in;
        width: 1.6in;
        height: 2.1333in;
        border: 0.75pt solid var(--zima);
        box-shadow: 0 0 0 2pt var(--ink), 0 0 0 2.6pt rgba(174, 14, 54, 0.8);
      }

      .front__name {
        position: absolute;
        top: 2.85in;
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 17pt;
        letter-spacing: 0.12em;
        line-height: 1;
      }

      .front__title {
        position: absolute;
        top: 3.19in;
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--font-body);
        font-size: 6.5pt;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--zima);
      }

      /* ---------- back ---------- */

      .back__qr {
        position: absolute;
        top: 0.59in;
        left: 50%;
        width: 1.2in;
        height: 1.2in;
        transform: translateX(-50%);
      }

      .back__url {
        position: absolute;
        top: 1.85in;
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--font-body);
        font-size: 6pt;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .back__links {
        position: absolute;
        top: 2.15in;
        left: 0.3in;
        right: 0.3in;
        padding-top: 0.12in;
        border-top: 0.5pt solid rgba(20, 99, 111, 0.8);
        list-style: none;
        display: grid;
        gap: 0.055in;
      }

      .back__links li {
        display: grid;
        grid-template-columns: 8pt auto 1fr;
        align-items: center;
        gap: 5pt;
        font-size: 7.5pt;
        line-height: 1.2;
      }

      .back__links svg {
        width: 7pt;
        height: 7pt;
        fill: var(--zima);
        color: var(--zima);
      }

      .back__links .label {
        font-family: var(--font-display);
        letter-spacing: 0.06em;
      }

      .back__links .handle {
        justify-self: end;
        font-family: var(--font-body);
        font-style: italic;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="page front">
      <img class="front__portrait" src="../portrait-full.jpg" alt="Portrait of Ra Mour" />
      <h1 class="front__name">Ra Mour</h1>
      <p class="front__title">Alchemist</p>
    </section>

    <section class="page back">
      <img class="back__qr" src="../qr.svg" alt="QR code linking to ramour.org/hello_world.html" />
      <p class="back__url">ramour.org/hello_world.html</p>
